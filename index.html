<!--
  LA PUERTA de portal.lletrainversiones.com (Daniel, 15/09/2026, "3A: lo más seguro posible, que nadie externo pueda
  ingresar"). Esta página es pública y por eso NO dice nada de cómo está organizada la empresa: solo el logo y el botón.
  El botón lleva a la página de entrada, que es una web app de Apps Script restringida al dominio: Google pide la cuenta
  de LLETRA antes de mostrar los módulos. generar-entrada.js verifica que aquí no se cuele ningún nombre de módulo ni
  ninguna dirección de portal.
  NO EDITAR index.html A MANO: se genera con generar-entrada.js. Marcadores: LOGO_DATA_URI y URL_ENTRADA.

<style>
  :root { --azul: #1F3864; --azul-oscuro: #16294a; --ambar: #D98E1B; --gris: #F3F5F9; --borde: #DCE1EA; --texto: #17202e; --suave: #5a6376; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--azul); color: var(--texto); font-family: "Barlow", "Segoe UI", Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.45; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
  .tarjeta { background: #fff; border-radius: 14px; padding: 34px 30px 30px; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.25); border-top: 5px solid var(--ambar); }
  .tarjeta img { height: 56px; width: auto; display: block; margin: 0 auto 18px; background: var(--azul); padding: 8px 14px; border-radius: 8px; }
  h1 { margin: 0; font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif; font-size: 28px; font-weight: 700; color: var(--azul); text-transform: uppercase; letter-spacing: .04em; line-height: 1; }
  .empresa { margin-top: 6px; font-size: 13px; color: var(--suave); letter-spacing: .06em; }
  .btn { display: block; margin: 26px 0 14px; min-height: 52px; line-height: 52px; border-radius: 10px; background: var(--azul); color: #fff; font-weight: 600; font-size: 17px; text-decoration: none; }
  .btn:hover { background: var(--azul-oscuro); }
  .btn:focus-visible { outline: 3px solid var(--ambar); outline-offset: 2px; }
  .nota { margin: 0; font-size: 13.5px; color: var(--suave); }
  footer { text-align: center; color: #F2C46D; font-size: 12.5px; padding: 12px 20px 18px; }
</style>
